<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#11100f"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Literário"
    >

    <title>FLIBARRA</title>

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="app">


    <!-- =====================================
         CABEÇALHO
    ====================================== -->

    <header class="hero">

        <div class="eyebrow">
            FLIBARRA 2026
        </div>


        <h1>
            Vozes que<br>
            <em>permanecem.</em>
        </h1>


        <p>
            Toque em uma obra para ouvir
            a voz por trás das palavras.
        </p>

    </header>



    <!-- =====================================
         POEMAS
    ====================================== -->

    <section class="poems-section">


        <div class="section-heading">

            <span>
                POEMAS
            </span>

            <span id="poemCount">
                00 obras
            </span>

        </div>


        <div
            id="poemList"
            class="poem-list"
        ></div>


    </section>


</main>



<!-- =========================================
     PLAYER
========================================== -->

<section
    id="player"
    class="player"
    aria-hidden="true"
>


    <div class="player-inner">


        <!-- FECHAR -->

        <button
            id="closePlayer"
            class="icon-button close-button"
            aria-label="Fechar player"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path d="M6 6L18 18"/>
                <path d="M18 6L6 18"/>

            </svg>

        </button>



        <!-- AUTOR -->

        <div class="player-author">


            <div
                id="authorImage"
                class="author-image"
            >

                <span id="authorInitials">
                    ?
                </span>

            </div>



            <div class="player-info">


                <div class="now-playing-label">
                    OUVINDO AGORA
                </div>


                <h2 id="playerTitle">
                    Selecione um poema
                </h2>


                <p id="playerAuthor">
                    Autor
                </p>


            </div>


        </div>



        <!-- PROGRESSO -->

        <div class="progress-area">


            <input
                id="progress"
                type="range"
                min="0"
                max="100"
                value="0"
                aria-label="Progresso do áudio"
            >


            <div class="time-row">

                <span id="currentTime">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>


        </div>



        <!-- =================================
             CONTROLES
        ================================== -->

        <div class="controls">


            <!-- ANTERIOR -->

            <button
                id="previous"
                class="secondary-control"
                aria-label="Poema anterior"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path d="M11 18L4 12L11 6"/>
                    <path d="M20 18L13 12L20 6"/>

                </svg>

            </button>



            <!-- PLAY / PAUSE -->

            <button
                id="playPause"
                class="play-button"
                aria-label="Reproduzir"
            >


                <!-- PLAY -->

                <svg
                    class="play-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path d="M8 5L19 12L8 19Z"/>

                </svg>



                <!-- PAUSE -->

                <svg
                    class="pause-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path d="M7 5V19"/>
                    <path d="M17 5V19"/>

                </svg>


            </button>



            <!-- PRÓXIMO -->

            <button
                id="next"
                class="secondary-control"
                aria-label="Próximo poema"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path d="M13 18L20 12L13 6"/>
                    <path d="M4 18L11 12L4 6"/>

                </svg>

            </button>


        </div>



        <div
            id="audioMessage"
            class="audio-message"
        ></div>


    </div>

</section>



<audio
    id="audio"
    preload="metadata"
></audio>



<script src="script.js"></script>


</body>

</html>

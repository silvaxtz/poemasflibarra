<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#181a1d"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="FLIBARRA"
    >

    <title>FLIBARRA 2026</title>


    <link
        rel="manifest"
        href="manifest.json"
    >


    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         TELA INICIAL
    ========================================== -->

    <main
        id="home"
        class="home-screen"
    >


        <!-- Fundo -->

        <div
            class="background-blur"
            aria-hidden="true"
        ></div>


        <div
            class="background-overlay"
            aria-hidden="true"
        ></div>



        <!-- Conteúdo principal -->

        <div class="home-content">


            <div class="festival-label">

                EXPERIÊNCIA LITERÁRIA

            </div>



            <!-- LOGO -->

            <button
                id="enterButton"
                class="logo-button"
                aria-label="Entrar no FLIBARRA"
            >

                <img
                    src="flibarra-logo.png"
                    alt="FLIBARRA — Festival Literário de Barra de São Miguel 2026"
                    class="flibarra-logo"
                >

            </button>



            <!-- Indicação de toque -->

            <div class="touch-hint">


                <span class="touch-icon">

                    <span></span>

                </span>


                <span>
                    Toque para entrar
                </span>


            </div>


        </div>


    </main>



    <!-- =========================================
         BIBLIOTECA / POEMAS
    ========================================== -->

    <main
        id="library"
        class="library-screen"
    >


        <header class="library-header">


            <!-- VOLTAR -->

            <button
                id="backHome"
                class="back-button"
                aria-label="Voltar"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path d="M15 18L9 12L15 6"/>

                </svg>

            </button>



            <!-- TÍTULO -->

            <div>

                <span class="library-kicker">

                    FLIBARRA 2026

                </span>


                <h1>

                    Vozes &amp; palavras

                </h1>

            </div>



            <!-- CONTADOR -->

            <span
                id="poemCount"
                class="library-count"
            >

                00

            </span>


        </header>



        <!-- LISTA -->

        <section class="poems-section">


            <div
                id="poemList"
                class="poem-list"
            ></div>


        </section>


    </main>



    <!-- =========================================
         PLAYER
    ========================================== -->

    <section
        id="player"
        class="player"
        aria-hidden="true"
    >


        <div class="player-inner">


            <!-- FECHAR -->

            <button
                id="closePlayer"
                class="icon-button close-button"
                aria-label="Fechar player"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path d="M6 6L18 18"/>

                    <path d="M18 6L6 18"/>

                </svg>

            </button>



            <!-- AUTOR -->

            <div class="player-author">


                <div
                    id="authorImage"
                    class="author-image"
                >

                    <span id="authorInitials">
                        ?
                    </span>

                </div>



                <div class="player-info">


                    <div class="now-playing-label">

                        OUVINDO AGORA

                    </div>


                    <h2 id="playerTitle">

                        Selecione uma obra

                    </h2>


                    <p id="playerAuthor">

                        Autor

                    </p>


                </div>


            </div>



            <!-- PROGRESSO -->

            <div class="progress-area">


                <input
                    id="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                    aria-label="Progresso do áudio"
                >



                <div class="time-row">


                    <span id="currentTime">

                        0:00

                    </span>


                    <span id="duration">

                        0:00

                    </span>


                </div>


            </div>



            <!-- CONTROLES -->

            <div class="controls">


                <!-- ANTERIOR -->

                <button
                    id="previous"
                    class="secondary-control"
                    aria-label="Obra anterior"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path d="M11 18L4 12L11 6"/>

                        <path d="M20 18L13 12L20 6"/>

                    </svg>

                </button>



                <!-- PLAY / PAUSE -->

                <button
                    id="playPause"
                    class="play-button"
                    aria-label="Reproduzir"
                >


                    <svg
                        class="play-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path d="M8 5L19 12L8 19Z"/>

                    </svg>



                    <svg
                        class="pause-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path d="M7 5V19"/>

                        <path d="M17 5V19"/>

                    </svg>


                </button>



                <!-- PRÓXIMO -->

                <button
                    id="next"
                    class="secondary-control"
                    aria-label="Próxima obra"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path d="M13 18L20 12L13 6"/>

                        <path d="M4 18L11 12L4 6"/>

                    </svg>

                </button>


            </div>



            <!-- MENSAGEM -->

            <div
                id="audioMessage"
                class="audio-message"
            ></div>


        </div>


    </section>



    <!-- =========================================
         ÁUDIO
    ========================================== -->

    <audio
        id="audio"
        preload="metadata"
    ></audio>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>

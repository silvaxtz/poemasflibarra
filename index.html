<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f5e4c7"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="FLIBARRA"
    >

    <title>FLIBARRA 2026</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         TELA PRINCIPAL
    ========================================== -->

    <main
        id="home"
        class="home-screen"
    >

        <div
            class="event-background"
            aria-hidden="true"
        ></div>


        <div
            class="event-pattern"
            aria-hidden="true"
        ></div>


        <div class="home-content">


            <!-- TEXTO -->

            <section class="hero-copy">

                <div class="hero-kicker">
                    12º FLIBARRA • 2026
                </div>


                <h1>
                    Vozes que
                    <br>
                    <em>permanecem.</em>
                </h1>


                <p>
                    Uma experiência literária
                    através das vozes e histórias
                    de Barra de São Miguel.
                </p>

            </section>



            <!-- LOGO -->

            <button
                id="enterButton"
                class="logo-button"
                aria-label="Entrar no FLIBARRA"
            >

                <img
                    src="flibarra-logo.png"
                    alt="FLIBARRA — Festival Literário de Barra de São Miguel 2026"
                    class="flibarra-logo"
                >

                <span class="logo-hint">
                    Toque na logo para entrar
                </span>

            </button>


        </div>

    </main>



    <!-- =========================================
         LISTA DE OBRAS
    ========================================== -->

    <main
        id="library"
        class="library-screen"
    >


        <header class="library-header">


            <button
                id="backHome"
                class="back-button"
                aria-label="Voltar"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path d="M15 18L9 12L15 6"/>

                </svg>

            </button>



            <div>

                <div class="library-kicker">
                    12º FLIBARRA • 2026
                </div>


                <h1>
                    Obras literárias
                </h1>

            </div>



            <span
                id="poemCount"
                class="library-count"
            >
                00
            </span>


        </header>



        <section class="poems-section">

            <div
                id="poemList"
                class="poem-list"
            ></div>

        </section>


    </main>



    <!-- =========================================
         PLAYER
    ========================================== -->

    <section
        id="player"
        class="player"
        aria-hidden="true"
    >


        <div class="player-inner">


            <button
                id="closePlayer"
                class="close-button"
                aria-label="Fechar player"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path d="M6 6L18 18"/>
                    <path d="M18 6L6 18"/>

                </svg>

            </button>



            <div class="player-author">


                <div
                    id="authorImage"
                    class="author-image"
                >

                    <span id="authorInitials">
                        ?
                    </span>

                </div>



                <div class="player-info">

                    <div class="now-playing-label">
                        OUVINDO AGORA
                    </div>


                    <h2 id="playerTitle">
                        Selecione uma obra
                    </h2>


                    <p id="playerAuthor">
                        Autor
                    </p>

                </div>


            </div>



            <div class="progress-area">


                <input
                    id="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                    aria-label="Progresso do áudio"
                >


                <div class="time-row">

                    <span id="currentTime">
                        0:00
                    </span>

                    <span id="duration">
                        0:00
                    </span>

                </div>


            </div>



            <div class="controls">


                <button
                    id="previous"
                    class="secondary-control"
                    aria-label="Obra anterior"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path d="M11 18L4 12L11 6"/>
                        <path d="M20 18L13 12L20 6"/>

                    </svg>

                </button>



                <button
                    id="playPause"
                    class="play-button"
                    aria-label="Reproduzir"
                ></button>



                <button
                    id="next"
                    class="secondary-control"
                    aria-label="Próxima obra"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path d="M13 18L20 12L13 6"/>
                        <path d="M4 18L11 12L4 6"/>

                    </svg>

                </button>


            </div>



            <div
                id="audioMessage"
                class="audio-message"
            ></div>


        </div>

    </section>



    <audio
        id="audio"
        preload="metadata"
    ></audio>



    <script src="script.js"></script>


</body>

</html>
